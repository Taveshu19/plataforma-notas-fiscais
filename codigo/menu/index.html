  <script>
    (() => {
      try {
        const saved = localStorage.getItem('empresaexemplo_hub_theme');
        document.documentElement.dataset.theme = ['light','dark'].includes(saved)
          ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      color-scheme:dark;
      --bg:#07112d; --surface:#0d1a40; --surface-bottom:#0a1636;
      --ink:#eef3fd; --muted:#a4b3d6; --faint:#8596bd; --line:#1d2c5c;
      --mint:#4f8fff; --button:#14245a; --grid:#6f97ff0b;
      --blue:#4f8fff; --blue-rgb:79,143,255;
      --orange:#8fc2ff; --orange-rgb:143,194,255;
      --green:#a9b6ff; --green-rgb:169,182,255;
      --shadow:0 18px 44px -30px #0009;
      --ease:cubic-bezier(.22,1,.36,1);
      --display:'Manrope','Segoe UI',sans-serif;
      --body:'Inter','Segoe UI',sans-serif;
    }
    html[data-theme="light"] {
      color-scheme:light;
      --bg:#f2f6fd; --surface:#ffffff; --surface-bottom:#f5f8fe;
      --ink:#0b1f4d; --muted:#4a5b82; --faint:#5b6b91; --line:#d4ddf0;
      --mint:#0061f5; --button:#e5edfc; --grid:#00227908;
      --blue:#0061f5; --blue-rgb:0,97,245;
      --orange:#1f74d6; --orange-rgb:31,116,214;
      --green:#002279; --green-rgb:0,34,121;
      --shadow:0 18px 44px -30px #00227940;
    }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; min-width:280px; min-height:100vh; min-height:100svh; background:var(--bg); color:var(--ink); font:14px/1.6 var(--body); -webkit-font-smoothing:antialiased; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; }
    a { color:inherit; }
    :focus-visible { outline:2px solid var(--mint); outline-offset:6px; }
    ::selection { background:var(--mint); color:var(--bg); }
    .ambient { position:fixed; inset:0; pointer-events:none; z-index:-1; background:radial-gradient(ellipse at 85% 0%,#0061f51c,transparent 48%),radial-gradient(ellipse at 0% 80%,#0022790f,transparent 55%); }
    .ambient::after { content:''; position:absolute; inset:0; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:72px 72px; mask-image:linear-gradient(#0008,transparent 72%); }
    .page { width:min(1180px,calc(100% - 96px)); margin:0 auto; }
    .topbar { min-height:108px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); gap:24px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:40px; height:40px; object-fit:contain; flex-shrink:0; }
    html[data-theme="dark"] .brand-mark { background:#f5f8ff; border-radius:10px; padding:4px; box-shadow:0 0 0 1px #ffffff1f; }
    .brand-name { font:800 13px/1.3 var(--display); letter-spacing:1.8px; }
    .brand-sub { display:block; margin-top:5px; font:400 9px var(--body); letter-spacing:1.2px; color:var(--muted); }
    .top-actions { display:flex; align-items:center; gap:24px; }
    .portal-label { font-size:10px; letter-spacing:.3px; color:var(--muted); }
    .theme-toggle { display:grid; place-items:center; width:40px; height:40px; padding:0; border:1px solid var(--line); border-radius:50%; background:transparent; color:var(--ink); cursor:pointer; transition:background .18s,transform .25s var(--ease); }
    .theme-toggle svg { width:17px; height:17px; }
    .theme-toggle:hover { background:var(--button); transform:rotate(12deg); }
    .moon-icon,html[data-theme="light"] .sun-icon { display:none; }
    html[data-theme="light"] .moon-icon { display:block; }
    .hero { position:relative; padding:65px 0 46px; }
    .eyebrow { display:flex; align-items:center; gap:9px; margin:0 0 22px; color:var(--mint); font-size:9px; font-weight:600; letter-spacing:2.4px; }
    .eyebrow::before { content:''; width:20px; height:1px; background:currentColor; }
    h1 { position:relative; z-index:1; font:500 clamp(40px,4.6vw,65px)/1.12 var(--display); letter-spacing:-3px; margin:0; }
    h1 span { color:var(--mint); }
    .hero-copy { position:relative; z-index:1; color:var(--muted); margin:23px 0 0; font-size:12px; }
    .hero-art { position:absolute; width:350px; height:245px; top:34px; right:23px; color:var(--mint); pointer-events:none; }
    .section-heading { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:0 0 17px; }
    .section-heading h2 { font:500 11px var(--body); color:var(--muted); margin:0; }
    .section-heading span { color:var(--faint); font-size:9px; letter-spacing:1px; }
    .cards-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
    .card-entry { min-width:0; }
    .team-card { position:relative; display:flex; flex-direction:column; min-height:365px; height:100%; padding:24px 27px 0; border:1px solid var(--line); border-radius:15px; background:linear-gradient(155deg,var(--surface),var(--surface-bottom)); color:var(--ink); text-decoration:none; overflow:hidden; box-shadow:var(--shadow); transition:transform .36s var(--ease),border-color .2s; }
    .team-card::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 15%,rgba(var(--accent-rgb),.11),transparent 75%); opacity:.45; pointer-events:none; transition:opacity .35s; }
    .team-card::after { content:''; position:absolute; top:0; left:27px; right:27px; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.3; transform:scaleX(.55); transition:transform .4s var(--ease),opacity .3s; }
    .card-expansao { --accent:var(--blue); --accent-rgb:var(--blue-rgb); }
    .card-engenharia { --accent:var(--orange); --accent-rgb:var(--orange-rgb); }
    .card-administrativo { --accent:var(--green); --accent-rgb:var(--green-rgb); }
    .card-top { position:relative; display:flex; align-items:center; justify-content:space-between; font-size:9px; color:var(--accent); letter-spacing:1.6px; }
    .team-symbol { width:19px; height:19px; }
    .card-art { position:relative; align-self:center; display:block; width:100%; max-width:250px; height:150px; margin:7px 0 12px; overflow:visible; color:var(--accent); }
    .art-detail { transform-box:fill-box; transform-origin:center; transition:transform .55s var(--ease); }
    .card-content { position:relative; padding-bottom:26px; }
    .team-name { font:600 clamp(23px,2.1vw,28px)/1.3 var(--display); letter-spacing:-1px; margin:0 0 11px; }
    .team-description { font-size:11px; line-height:1.85; margin:0; color:var(--muted); max-width:260px; }
    .card-action { position:relative; display:flex; align-items:center; justify-content:space-between; margin-top:auto; min-height:64px; gap:16px; border-top:1px solid var(--line); font-size:10px; font-weight:500; }
    .card-action > span:first-child { transition:color .2s; }
    .action-arrow { display:grid; place-items:center; width:29px; height:29px; border:1px solid var(--line); border-radius:50%; color:var(--accent); transition:transform .35s var(--ease),background .2s; }
    .action-arrow svg { width:14px; height:14px; }
    .team-card:focus-visible { outline-color:var(--accent); border-color:var(--accent); }
    .team-card:focus-visible .action-arrow { transform:rotate(-40deg); background:rgba(var(--accent-rgb),.1); }
    @media(hover:hover) and (pointer:fine) {
      .team-card:hover { transform:translateY(-6px); border-color:var(--accent); }
      .team-card:hover::before { opacity:1; }
      .team-card:hover::after { transform:scaleX(1); opacity:.8; }
      .team-card:hover .art-detail { transform:translateY(-5px); }
      .team-card:hover .card-action > span:first-child { color:var(--accent); }
      .team-card:hover .action-arrow { transform:rotate(-40deg); background:rgba(var(--accent-rgb),.1); }
    }
    .team-card:active { transform:translateY(-2px); }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:27px 0 28px; margin-top:31px; border-top:1px solid var(--line); color:var(--faint); font-size:9px; }
    .footer-brand { color:var(--muted); }
    .footer-dot { display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--mint); margin:0 9px 2px 0; }
    .footer-note { display:flex; align-items:center; gap:7px; }
    .footer-note svg { width:12px; height:12px; }
    .enter { animation:enter .72s var(--ease) backwards; }
    .hero.enter { animation-delay:.06s; }
    .section-heading.enter { animation-delay:.12s; }
    .card-entry:nth-child(1) { animation-delay:.16s; }
    .card-entry:nth-child(2) { animation-delay:.23s; }
    .card-entry:nth-child(3) { animation-delay:.3s; }
    .footer.enter { animation-delay:.36s; }
    @keyframes enter { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none} }
    @media(min-width:1600px) { .hero{padding-top:85px;padding-bottom:66px}.hero-art{top:54px}.team-card{min-height:390px}.card-art{height:170px} }
    @media(min-width:761px) and (max-height:850px) {
      .topbar{min-height:76px}.hero{padding-top:32px;padding-bottom:28px}
      h1{font-size:50px;letter-spacing:-2.3px}.eyebrow{margin-bottom:16px}.hero-copy{margin-top:16px}
      .hero-art{height:200px;top:17px}.team-card{min-height:330px;padding-top:20px}
      .card-art{height:120px;margin:4px 0 8px}.card-content{padding-bottom:20px}.team-name{font-size:25px}
      .footer{margin-top:24px;padding-top:20px;padding-bottom:20px}
    }
    @media(max-width:1000px) { .page{width:calc(100% - 64px)}.hero-art{width:280px;right:0;opacity:.7}.team-card{padding:22px 21px 0}.cards-grid{gap:14px}.team-name{font-size:23px}.team-description{font-size:10px}.hero{padding-top:52px} }
    @media(max-width:760px) {
      .page{width:calc(100% - 40px);max-width:520px}.topbar{min-height:88px}.portal-label{display:none}
      .brand-name{font-size:11px}.brand-sub{font-size:8px}.brand-mark{width:34px;height:34px}.theme-toggle{width:38px;height:38px}
      .hero{padding:44px 0 36px}.hero-art{display:none}h1{font-size:clamp(38px,8vw,51px);letter-spacing:-2px}
      .eyebrow{font-size:8px;letter-spacing:1.8px;margin-bottom:20px}.hero-copy{font-size:11px;max-width:270px;line-height:1.8;margin-top:18px}
      .section-heading{padding-bottom:14px}.section-heading span{font-size:8px}
      .cards-grid{grid-template-columns:1fr;gap:15px}.team-card{min-height:0;padding:21px 23px 0}
      .card-top{font-size:8px;max-width:calc(100% - 12px)}
      .card-art{position:absolute;right:13px;top:31px;width:125px;height:104px;margin:0;opacity:.75}
      .card-content{padding:25px 0 23px;max-width:calc(100% - 100px)}.team-name{font-size:26px;margin-bottom:9px}
      .team-description{font-size:10px;line-height:1.8}.card-action{min-height:57px;font-size:10px}
      .footer{margin-top:25px;padding:22px 0 26px;flex-wrap:wrap;font-size:8px;gap:8px 16px}
    }
    @media(max-width:360px) { .page{width:calc(100% - 32px)}.team-card{padding-left:18px;padding-right:18px}.card-art{width:100px;right:4px}.card-content{max-width:calc(100% - 75px)}.team-name{font-size:23px}.section-heading span{letter-spacing:0} }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
      .team-card:hover,.team-card:active,.team-card:hover .art-detail,.action-arrow,.theme-toggle:hover { transform:none!important; }
    }
    @media print { .theme-toggle,.hero-art,.ambient{display:none}.page{width:100%}.team-card{break-inside:avoid;box-shadow:none}.enter{animation:none} }

    /* Revisão do menu: foco nos três acessos, com marca e títulos centralizados. */
    .page { width:min(1280px,calc(100% - 96px)); min-height:100svh; display:flex; flex-direction:column; }
    .topbar { position:relative; justify-content:center; flex-shrink:0; }
    .brand { margin-inline:auto; }
    .top-actions { position:absolute; right:0; }
    main { flex:1; display:flex; flex-direction:column; justify-content:center; padding:42px 0 54px; }
    .section-heading { justify-content:center; padding-bottom:32px; text-align:center; }
    .section-heading h1 { margin:0; font:500 clamp(26px,2.6vw,38px)/1.3 var(--display); letter-spacing:-1.2px; color:var(--ink); text-wrap:balance; }
    .cards-grid { gap:24px; }
    .team-card { min-height:clamp(480px,58vh,560px); padding:32px; align-items:center; justify-content:center; }
    .card-top { position:absolute; top:25px; right:25px; }
    .card-art { position:relative; inset:auto; width:100%; height:220px; max-width:300px; margin:12px 0 26px; opacity:1; flex-shrink:0; }
    .card-content { width:100%; max-width:none; padding:0; text-align:center; }
    .team-name { margin:0; font-size:32px; text-align:center; }
    .card-action { width:100%; min-height:40px; margin:24px 0 0; border:0; justify-content:center; }
    .action-arrow { width:38px; height:38px; }
    .action-arrow svg { width:17px; height:17px; }
    .footer { flex-shrink:0; }
    /* Só Expansão e Engenharia (14/11): o Administrativo (Notas TAG) fica numa aba dentro da Engenharia. */
    .cards-grid { grid-template-columns:repeat(2,minmax(0,1fr)); width:100%; max-width:900px; margin-inline:auto; }
    @media(min-width:761px) and (max-height:850px) {
      main{padding-top:30px}.team-card{min-height:420px;padding:26px}
      .card-art{height:180px;margin:10px 0 22px}.team-name{font-size:29px}
    }
    @media(min-width:761px) and (max-width:1000px) {
      .page{width:calc(100% - 48px)}.cards-grid{gap:16px}.team-card{padding:24px 16px}
      .team-name{font-size:23px}.card-art{height:190px}
    }
    @media(max-width:760px) {
      .page{width:calc(100% - 40px);max-width:520px}
      main{padding:30px 0 36px}.cards-grid{gap:18px;grid-template-columns:1fr}.section-heading{padding-bottom:25px}.section-heading h1{font-size:27px;letter-spacing:-.8px}
      .team-card{min-height:280px;padding:25px}
      .card-top{top:20px;right:20px}.card-art{height:140px;max-width:230px;margin:0 0 14px}
      .team-name{font-size:28px}.card-action{margin-top:18px;min-height:34px}
      .action-arrow{width:32px;height:32px}
    }
    @media(max-width:360px) {
      .page{width:calc(100% - 32px)}.brand{gap:8px}.brand-name{font-size:10px;letter-spacing:1px}
      .brand-sub{font-size:7px;letter-spacing:.6px}.theme-toggle{width:32px;height:32px}
      .team-name{font-size:26px}.section-heading{gap:8px}.section-heading span{font-size:7px}
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="page">

  <script>
    (() => {
      'use strict';
      const root = document.documentElement;
      const button = document.querySelector('.theme-toggle');
      const meta = document.querySelector('meta[name="theme-color"]');
      function updateThemeControl() {
        const dark = root.dataset.theme === 'dark';
        button.setAttribute('aria-label', dark ? 'Ativar tema claro' : 'Ativar tema escuro');
        button.title = (dark ? 'Ativar tema claro' : 'Ativar tema escuro') + ' (T)';
        meta.content = dark ? '#07112d' : '#f2f6fd';
      }
      function toggleTheme() {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('empresaexemplo_hub_theme', root.dataset.theme); } catch (_) {}
        updateThemeControl();
      }
      button.addEventListener('click', toggleTheme);
      window.addEventListener('keydown', event => {
        if (event.repeat || event.ctrlKey || event.metaKey || event.altKey ||
            event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
        if (event.key.toLowerCase() === 't') { event.preventDefault(); toggleTheme(); }
      });
      updateThemeControl();
    })();
  </script>
