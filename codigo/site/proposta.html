<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#152840;background:#f2f5f9;font-size:14px;--blue:#165bd5;--line:#dce4ed;--muted:#62738a;--navy:#10243c}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible{outline:3px solid #edb646;outline-offset:3px}button{border:1px solid var(--line);background:white;color:#203b5d;padding:10px 14px;border-radius:8px;font-weight:600}button:hover{background:#edf3fc}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.primary:hover{background:#104ebc}button.small{padding:7px 11px;font-size:12px}a{color:var(--blue)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:900px}.sidebar{background:var(--navy);color:#afc0d5;padding:30px 18px;display:flex;flex-direction:column;gap:8px}.brand{color:white;font-size:22px;letter-spacing:-.7px;font-weight:700;padding:0 10px 25px}.brand span{display:block;font-size:10px;letter-spacing:2px;color:#7eaddf;margin-top:8px}.navlabel{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;padding:24px 10px 6px;color:#7e94af}.navbtn{border:0;background:transparent;color:#c8d6e7;text-align:left;padding:12px;font-weight:500}.navbtn:hover{background:#1c3654;color:white}.navbtn.active{background:#28496d;color:white;box-shadow:inset 3px 0 #78b2ff}.sidefoot{margin-top:auto;padding:35px 10px 0;font-size:12px;line-height:1.8}.sidefoot a{color:#add0ff}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);display:flex;gap:15px;align-items:center;justify-content:space-between;padding:18px 32px}.top small{color:var(--muted)}.demo{background:#fff3d9;border:1px solid #f0d292;border-radius:6px;padding:8px 12px;color:#825914;font-size:12px}.content{padding:30px 32px 45px;max-width:1600px;margin:auto}.eyebrow{text-transform:uppercase;color:var(--blue);font-size:10px;letter-spacing:2px;font-weight:700}h1{font-size:28px;letter-spacing:-.8px;margin:8px 0 10px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 10px}p{line-height:1.6;margin:8px 0}.muted{color:var(--muted)}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px}.stat{padding:18px}.stat strong{font-size:27px;display:block;margin:7px 0 4px}.stat span{font-size:12px;color:var(--muted)}.panel{padding:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{font-size:12px}.tab.active{border-color:var(--blue);background:#eaf1ff;color:#1254c4}.count{display:inline-block;background:#e4ebf4;border-radius:5px;padding:1px 5px;margin-left:5px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:16px 0}.search{max-width:420px;width:100%}input,select,textarea{background:white;border:1px solid #c9d4e1;color:#17304e;border-radius:7px;padding:10px;width:100%}textarea{min-height:86px;resize:vertical}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:white}table{width:100%;border-collapse:collapse;text-align:left}th{padding:14px 16px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);background:#f9fbfe;white-space:nowrap}td{padding:16px;border-top:1px solid #e7edf4;font-size:13px}td small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.pill{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;padding:5px 8px;border-radius:5px;background:#edf2f9;color:#3d5e85}.pill.blue{background:#e9f0ff;color:#215bc2}.pill.green{background:#e6f5ee;color:#20714f}.pill.amber{background:#fff3d9;color:#80580f}.pill.red{background:#fbeaec;color:#a4404a}.split{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}.note{border-left:3px solid #8eb2e5;padding:10px 15px;background:#ecf2fa;color:#3d5877;font-size:12px;margin:18px 0}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0}.step{padding:16px;background:white;border:1px solid var(--line);border-radius:8px;font-size:12px;line-height:1.6}.step b{display:block;color:var(--blue);font-size:11px;margin-bottom:7px}.field{display:block;margin:15px 0;font-size:12px;font-weight:600}.field input,.field select,.field textarea{display:block;margin-top:7px;font-weight:400}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:15px 0 22px}.facts span{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.facts strong{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 0}.empty{text-align:center;padding:45px;color:var(--muted)}.history{padding:0;list-style:none}.history li{font-size:12px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.6}.history small{color:var(--muted);display:block}.modal{position:fixed;inset:0;background:#0a1b3099;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 20px;z-index:3}.dialog{background:#f6f8fb;width:min(920px,100%);border-radius:14px;padding:25px;box-shadow:0 20px 60px #0003}.close{float:right}.previewdoc{background:#f1f4f8;border:1px dashed #b8c9dd;padding:28px;min-height:150px;border-radius:8px;text-align:center}.previewdoc strong{display:block;font-size:18px;margin:12px 0}.footer{font-size:11px;color:var(--muted);margin-top:24px;line-height:1.8}.toast{position:fixed;bottom:24px;right:24px;max-width:420px;background:#17344f;color:white;padding:15px 20px;border-radius:9px;z-index:5;box-shadow:0 5px 30px #0003}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.permission{font-size:12px;line-height:1.6;border-radius:7px;padding:10px;background:#fff3d9;color:#80580f}dialog{border:none}ul{padding-left:20px;line-height:1.8}.profile{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}.profile select{width:195px;padding:7px}.reset{font-size:11px;background:transparent;color:#bdd2eb;border-color:#46617e}.hidden{display:none!important}@media(max-width:1000px){.layout{grid-template-columns:190px 1fr}.content{padding:24px 20px}.split,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(3,1fr)}.top{padding:16px 20px;flex-wrap:wrap}}@media(max-width:650px){.layout{display:block;min-height:0}.sidebar{padding:18px;display:block}.brand{padding:0 0 10px}.navlabel,.sidefoot{display:none}.navbtn{display:inline-block;font-size:12px;margin:3px;padding:9px}.top{padding:12px 18px}.profile select{width:175px}.content{padding:24px 16px}h1{font-size:25px}.head{align-items:flex-start;flex-direction:column}.steps{grid-template-columns:1fr 1fr}.fields,.facts{grid-template-columns:1fr}.modal{padding:10px}.dialog{padding:18px}.toolbar{flex-wrap:wrap}.stat{padding:14px}}

<main class="main"><header class="top"><div class="demo">PRÉVIA INTERATIVA · nenhum envio real</div><label class="profile">Simular perfil <select id="perfil"><option value="equipe">Equipe de lançamento</option><option value="engenharia">Engenharia</option><option value="compras">Compras</option><option value="admin">Visão completa</option></select></label></header><div id="content" class="content"></div></main>
</div><div id="modal" class="hidden"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Demonstração em memória: sem rede, credenciais, armazenamento ou integrações.
const labels={rascunho:'Conferência',engenharia:'Análise da engenharia',contrato:'Vincular contrato',fora:'Fora da expansão',pedido:'A lançar no Datasul',aprovacao:'Aguardando aprovação do pedido',escrituracao:'Pronta para escrituração',encaminhada:'Encaminhada ao fluxo',fiscal:'E-mail enviado ao fiscal'};
const seed=[{id:'NF-EX-001',fornecedor:'Horizonte Materiais',nf:'8042',unidade:'020 · Araraquara',natureza:'Material',valor:4280,vencimento:'12/11/2026',etapa:'rascunho',narrativa:'',contrato:'',expansao:'',pedido:''},{id:'NF-EX-002',fornecedor:'Estrutura Engenharia',nf:'217',unidade:'002 · Americana',natureza:'Serviço',valor:8450,vencimento:'16/11/2026',etapa:'engenharia',narrativa:'',contrato:'',expansao:'',pedido:''},{id:'NF-EX-003',fornecedor:'Norte Equipamentos',nf:'9301',unidade:'018 · Maringá',natureza:'Material',valor:1930,vencimento:'18/11/2026',etapa:'pedido',narrativa:'Material para adequação da plataforma de envase.',contrato:'Não',expansao:'Sim',pedido:''},{id:'NF-EX-004',fornecedor:'Base Serviços',nf:'331',unidade:'015 · Ipatinga',natureza:'Serviço',valor:6700,vencimento:'19/11/2026',etapa:'aprovacao',narrativa:'Serviço de manutenção da cobertura.',contrato:'Não',expansao:'Sim',pedido:'131800'},{id:'NF-EX-005',fornecedor:'Sul Materiais',nf:'1209',unidade:'006 · Pelotas',natureza:'Material',valor:1560,vencimento:'20/11/2026',etapa:'escrituracao',narrativa:'Materiais para instalação elétrica.',contrato:'Não',expansao:'Sim',pedido:'131809'},{id:'NF-EX-006',fornecedor:'Concreto Modelo',nf:'470',unidade:'019 · Pinhal',natureza:'Material',valor:5200,vencimento:'21/11/2026',etapa:'escrituracao',narrativa:'Concretagem da base da plataforma.',contrato:'Sim',expansao:'Sim',pedido:'131810'}];
let notas,requests,view='analise',tab='engenharia',perfil='equipe',selected=null,previousFocus=null;
function init(){notas=structuredClone(seed).map(n=>({...n,history:['Recebida e conferida · dados fictícios'],contratoRef:n.id==='NF-EX-006'?'CT-EX-03':'',boleto:true,dadosBanco:'Banco exemplo · dados fictícios',pagamento:'Boleto',emitente:'100200',anexo:true}));requests=[{id:'REQ-EX-001',nome:'Materiais para adequação da plataforma',unidade:'020 · Araraquara',tipo:'Material',prioridade:'Padrão',sla:10,etapa:'Aguardando Compras',comprador:'',terceiros:'Não solicitada',history:['Requisição criada; cotação vinculada.']},{id:'REQ-EX-002',nome:'Serviço de cobertura',unidade:'015 · Ipatinga',tipo:'Serviço',prioridade:'Padrão',sla:20,etapa:'Em cotação',comprador:'Compradora exemplo',terceiros:'Não solicitada',history:['Requisição criada; cotação vinculada.','Comprador atribuído; negociação iniciada.']},{id:'REQ-EX-003',nome:'Equipamento de manutenção',unidade:'006 · Pelotas',tipo:'Equipamento',prioridade:'Urgente',sla:3,etapa:'Aguardando Engenharia',comprador:'Compradora exemplo',terceiros:'Pendente',history:['Negociação concluída; engenharia deve analisar as propostas.']}];}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),can=role=>perfil==='admin'||perfil===role,pill=(text,cls='blue')=>`<span class="pill ${cls}">${esc(text)}</span>`,btn=(id,text,allowed=true,cls='primary')=>`<button id="${id}" class="${cls}" ${allowed?'':'disabled'}>${text}</button>`;
function notify(text){$('#toast').className='toast';$('#toast').textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{$('#toast').className='';$('#toast').textContent='';},6500);}
function log(n,text){n.history.push(`${text} · ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${perfil==='admin'?'Visão completa':perfil}`);}
function render(){ if(perfil==='engenharia'&&view==='entrada')view='analise'; $$('.navbtn').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.classList.toggle('hidden',perfil==='engenharia'&&b.dataset.view==='entrada');}); const titles={entrada:['EXPANSÃO / ENTRADA','Lançamento de notas','A conferência continua no painel que a equipe já conhece.'],analise:['EXPANSÃO / CONTINUIDADE','Aprovações e acompanhamento','Uma nota, do parecer da engenharia ao encaminhamento para escrituração.'],compras:['COMPRAS / PROCESSO INDEPENDENTE','Requisições e cotações','Solicitação, negociação e decisão conectadas pelo mesmo histórico.'],mapa:['PROPOSTA / VISÃO DO FLUXO','O próximo passo fica claro','Telas por responsabilidade, com etapas e ações explícitas.']};const t=titles[view];$('#content').innerHTML=`<div class="head"><div><div class="eyebrow">${t[0]}</div><h1>${t[1]}</h1><p class="muted">${t[2]}</p></div>${pill('Dados de demonstração','amber')}</div>`+(view==='mapa'?mapa():view==='compras'?compras():expansao())+`<div class="footer">Proposta para revisão · dados fictícios em memória. Recarregar reinicia a demonstração.<br>Não há autenticação real nesta prévia. Perfis e envios são simulados. A implantação precisa aplicar as permissões no servidor.</div>`;bind();}
function expansao(){const visiveis=notas.filter(n=>perfil!=='engenharia'||n.etapa!=='rascunho');const stats=[['Na engenharia',visiveis.filter(n=>n.etapa==='engenharia').length,'Análise de três campos'],['Pedidos pendentes',visiveis.filter(n=>['pedido','aprovacao','contrato'].includes(n.etapa)).length,'Ação da equipe'],['Prontas para enviar',visiveis.filter(n=>n.etapa==='escrituracao').length,'Validação antes do envio'],['Encaminhadas',visiveis.filter(n=>['encaminhada','fiscal'].includes(n.etapa)).length,'Resultado da simulação']];const tabs=view==='entrada'?[['rascunho','Em conferência'],['todas','Todas as notas']]:[['engenharia','Engenharia'],['pedido','A lançar'],['aprovacao','Aprovação do pedido'],['escrituracao','Escrituração'],['contrato','Contratos'],['fora','Fora da expansão'],['envios','Encaminhadas'],['todas','Todas']];if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];const lista=visiveis.filter(n=>tab==='todas'||(tab==='envios'?['encaminhada','fiscal'].includes(n.etapa):n.etapa===tab));return `<div class="stats">${stats.map(s=>`<div class="stat"><span>${s[0]}</span><strong>${s[1]}</strong><span>${s[2]}</span></div>`).join('')}</div>${view==='entrada'?'<div class="note">Esta tela representa o ponto de continuidade do painel existente. O recebimento de pasta, extração de documentos e edição completa serão reaproveitados na implementação.</div>':''}<div class="tabs">${tabs.map(([key,name])=>`<button class="tab ${key===tab?'active':''}" data-tab="${key}">${name}<span class="count">${visiveis.filter(n=>key==='todas'||(key==='envios'?['encaminhada','fiscal'].includes(n.etapa):n.etapa===key)).length}</span></button>`).join('')}</div><div class="toolbar"><input id="search" class="search" aria-label="Buscar nota ou fornecedor" placeholder="Buscar nota, fornecedor ou unidade…"><span class="muted">${lista.length} documentos</span></div><div class="tablewrap"><table><thead><tr><th>Documento / fornecedor</th><th>Unidade</th><th>Vencimento</th><th>Valor</th><th>Etapa</th><th>Próxima ação</th></tr></thead><tbody>${lista.map(n=>`<tr data-search="${esc((n.fornecedor+' '+n.nf+' '+n.unidade).toLowerCase())}"><td><b>NF ${esc(n.nf)}</b><small>${esc(n.fornecedor)}</small></td><td>${esc(n.unidade)}</td><td>${n.vencimento}</td><td>${money(n.valor)}</td><td>${pill(labels[n.etapa],n.etapa==='escrituracao'?'green':n.etapa==='contrato'?'amber':'blue')}</td><td><button class="small" data-note="${n.id}">${{rascunho:'Conferir e encaminhar',engenharia:'Analisar nota',pedido:'Registrar pedido',aprovacao:'Conferir aprovação',escrituracao:'Preparar envio',contrato:'Resolver contrato',fora:'Consultar destino',encaminhada:'Ver encaminhamento',fiscal:'Ver envio'}[n.etapa]}</button></td></tr>`).join('')}</tbody></table>${lista.length?'':'<div class="empty">Nenhuma nota nesta fila.<br>As próximas aparecerão ao concluir a etapa anterior.</div>'}</div>`;}
function mapa(){return `<div class="steps">${[['01','Conferir a nota','Equipe no painel atual'],['02','Aprovar a análise','Engenharia · três campos'],['03','Registrar pedido','Equipe · Datasul manual'],['04','Confirmar aprovação','Equipe verifica no Datasul'],['05','Encaminhar à escrituração','Botão com validações']].map(s=>`<div class="step"><b>${s[0]}</b><strong>${s[1]}</strong><br><span class="muted">${s[2]}</span></div>`).join('')}</div><div class="grid2"><section class="panel"><h2>Expansão · duas áreas</h2><p><b>Lançamento de notas:</b> pasta, extração e conferência permanecem como entrada.</p><p><b>Aprovações e acompanhamento:</b> engenharia vê sua fila; a equipe vê contratos, pedidos, aprovação e escrituração.</p><div class="note">Contrato = Sim abre a pendência de vínculo. Não pertence à expansão abre uma fila separada. Os dois destinos precisam continuar visíveis.</div><button data-goto="analise" class="primary">Explorar Expansão →</button></section><section class="panel"><h2>Compras · painel separado</h2><p>Requisições e cotações conectadas. Compras registra negociação e propostas; engenharia analisa; aprovação de terceiros fica identificada à parte.</p><p class="muted">Prazos encontrados: 10 dias para material/equipamento padrão, 20 para serviço padrão e 3 para urgentes.</p><div class="note">As regras de entrega, reprovação e aprovação de terceiros ainda precisam ser fechadas com a operação.</div><button data-goto="compras" class="primary">Explorar Compras →</button></section></div><section class="panel" style="margin-top:20px"><h2>O que o botão de envio precisa preservar</h2><p>Dados e anexos seguem para o Power Automate / SharePoint. Pinhal e Remessa seguem por e-mail ao fiscal. Preservar tradução dos campos, código do emitente, regras de pagamento, autoria e proteção contra envio duplicado.</p><p><b>Encaminhada ao fluxo</b> é diferente de recebida ou escriturada. A confirmação depende de retorno verificável da integração.</p><a href="docs/levantamento-2026-11-05.md">Consultar regras, evidências e sequência de implantação ↗</a></section>`;}
function compras(){return `<div class="stats">${['Aguardando Compras','Em cotação','Aguardando Engenharia','Aprovada'].map(s=>`<div class="stat"><span>${s}</span><strong>${requests.filter(r=>r.etapa===s).length}</strong><span>Requisições de exemplo</span></div>`).join('')}</div><div class="toolbar"><input id="search" class="search" aria-label="Buscar requisição" placeholder="Buscar requisição, unidade ou tipo…">${btn('newrequest','+ Nova requisição',can('engenharia'))}</div><div class="tablewrap"><table><thead><tr><th>Requisição / cotação</th><th>Unidade</th><th>Prioridade / prazo</th><th>Comprador</th><th>Etapa</th><th></th></tr></thead><tbody>${requests.map(r=>`<tr data-search="${esc((r.nome+' '+r.unidade+' '+r.tipo).toLowerCase())}"><td><b>${esc(r.nome)}</b><small>${r.id} ↔ COT-${r.id.replace('REQ-','')} · ${r.tipo}</small></td><td>${r.unidade}</td><td>${pill(r.prioridade,r.prioridade==='Urgente'?'red':'blue')}<small>SLA ${r.sla} dias corridos</small></td><td>${esc(r.comprador)||'A definir'}</td><td>${pill(r.etapa,r.etapa==='Aprovada'?'green':'blue')}</td><td><button class="small" data-req="${r.id}">Abrir processo</button></td></tr>`).join('')}</tbody></table></div><div class="note">Requisições e cotações compartilham o vínculo, os documentos e o histórico. A demonstração exercita o percurso principal; aprovação de terceiros, entregas e exceções exigem validação operacional antes da implementação.</div>`;}
function bind(){ $$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});$$('[data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note));$$('[data-req]').forEach(b=>b.onclick=()=>openReq(b.dataset.req));$$('[data-goto]').forEach(b=>b.onclick=()=>navigate(b.dataset.goto));if($('#search'))$('#search').oninput=e=>{$$('tr[data-search]').forEach(r=>r.hidden=!r.dataset.search.includes(e.target.value.toLowerCase()));};if($('#newrequest'))$('#newrequest').onclick=newRequest;}
function navigate(v){if(perfil==='engenharia'&&v==='entrada')v='analise';view=v;tab=v==='entrada'?'rascunho':perfil==='engenharia'?'engenharia':'pedido';render();}
function modal(title,html){if(!$('#modal').classList.contains('modal'))previousFocus=document.activeElement;$('#modal').className='modal';$('#modal').innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="close" id="close" aria-label="Fechar detalhes">✕</button><div class="eyebrow">Demonstração do processo</div><h1 style="font-size:22px">${esc(title)}</h1>${html}</section>`;$('#close').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close();};$('#close').focus();}
function close(){ $('#modal').className='hidden';$('#modal').innerHTML='';selected=null;if(previousFocus?.isConnected)previousFocus.focus();}
function history(n){return `<h3 style="margin-top:22px">Histórico desta demonstração</h3><ul class="history">${n.history.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;}
function permission(role){return can(role)?'':`<p class="permission">Ação disponível para ${role==='engenharia'?'Engenharia':role==='compras'?'Compras':'Equipe de lançamento'}. Troque o perfil na barra superior para simular.</p>`;}
function openNote(id){const n=notas.find(n=>n.id===id);if(!n||(perfil==='engenharia'&&n.etapa==='rascunho')){close();return notify('Nota indispon?vel para este perfil.');}selected=id;let action='';if(n.etapa==='rascunho')action=`<h2>Conferência concluída?</h2><p class="muted">Os campos e arquivos desta nota já estão preenchidos para demonstrar a continuidade.</p>${permission('equipe')}${btn('advance','Enviar para engenharia',can('equipe'))}`;
if(n.etapa==='engenharia')action=`<h2>Análise da engenharia</h2><p class="muted">Confira a nota e preencha os três campos.</p>${permission('engenharia')}<label class="field">Narrativa<textarea id="narrativa" ${can('engenharia')?'':'disabled'} placeholder="Descreva a finalidade desta nota">${esc(n.narrativa)}</textarea></label><div class="fields"><label class="field">É contrato?<select id="contrato" ${can('engenharia')?'':'disabled'}><option value="">Selecione</option><option>Sim</option><option>Não</option></select></label><label class="field">Pertence à expansão?<select id="expansao" ${can('engenharia')?'':'disabled'}><option value="">Selecione</option><option>Sim</option><option>Não</option></select></label></div><label class="field">Motivo da devolução (se necessário)<input id="motivo" ${can('engenharia')?'':'disabled'} placeholder="Descreva o ajuste necessário"></label><div class="actions">${btn('approve','Aprovar análise',can('engenharia'))}${btn('return','Devolver para conferência',can('engenharia'),'')}</div>`;
if(n.etapa==='contrato')action=`<h2>Vínculo de contrato pendente</h2><p class="muted">Na Monday, esta nota vai ao grupo Contratos. A referência pode ser resolvida pela equipe nesta etapa; responsabilidade e obrigatoriedade ainda precisam ser confirmadas.</p>${permission('equipe')}<label class="field">Referência do contrato (exemplo)<input id="contractRef" placeholder="CT-EX-001"></label>${btn('linkcontract','Vincular e liberar para pedido',can('equipe'))}`;
if(n.etapa==='fora')action='<h2>Fora da expansão</h2><p>Nota separada do fluxo comum. Definir com a equipe quem recebe e como registra o encaminhamento.</p><div class="note">Marcar “Não” é uma decisão de roteamento. A nota permanece visível, com parecer e histórico.</div>';
if(n.etapa==='pedido')action=`<h2>Pedido no Datasul</h2><p class="muted">Após lançar manualmente no Datasul, registre a referência aqui.</p>${permission('equipe')}<label class="field">Número do pedido<input id="pedido" value="${esc(n.pedido)}" placeholder="Ex.: 131820"></label>${btn('register','Registrar pedido lançado',can('equipe'))}`;
if(n.etapa==='aprovacao')action=`<h2>Aprovação do pedido</h2><p>Pedido <b>${esc(n.pedido)}</b></p><p class="muted">Confira o resultado no Datasul antes de confirmar. Este botão registra a verificação da equipe.</p>${permission('equipe')}${btn('approvedorder','Confirmar pedido aprovado',can('equipe'))}`;
if(n.etapa==='escrituracao')action=`<h2>Prévia para escrituração</h2><p>${pill(n.unidade.includes('Pinhal')||n.natureza==='Remessa'?'Destino: e-mail ao fiscal':'Destino: Power Automate / SharePoint','green')}</p><p class="muted">Validação reduzida para simular a interação. A implementação deve preservar todas as regras do código atual.</p>${permission('equipe')}<label class="field">Forma de pagamento<select id="pagamento"><option>Boleto</option><option>Dados Bancários</option><option>Cartão Corporativo</option></select></label><label class="field">Código do emitente Datasul<input id="emitente" value="${esc(n.emitente)}"></label><label class="field" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="boleto" ${n.boleto?'checked':''} style="width:auto"> Boleto anexado (simulação)</label><label class="field">Dados bancários (simulação)<input id="dadosBanco" value="${esc(n.dadosBanco)}"></label><div class="note">Na produção, o botão confere documentos, datas, emitente, traduções e situação do envio. A regra atual libera certas pendências de pagamento após cinco dias; não é executada nesta prévia.</div>${btn('send','Simular envio para escrituração',can('equipe'))}`;
if(['encaminhada','fiscal'].includes(n.etapa))action=`<h2>${n.etapa==='fiscal'?'E-mail ao fiscal simulado':'Encaminhamento simulado'}</h2><p>${n.etapa==='fiscal'?'Pinhal / Remessa segue pelo destino de e-mail do fiscal.':'Os dados e anexos foram encaminhados ao fluxo nesta demonstração.'}</p><div class="note">Nenhum documento foi enviado. Na produção, a confirmação de recebimento no SharePoint dependerá do retorno da integração; encaminhar não significa escriturar.</div><p class="muted">Reenvio precisa de ação explícita, motivo e conciliação. Não deve apagar o histórico anterior.</p>`;
modal(`NF ${n.nf} · ${n.fornecedor}`,`<div class="split"><section class="panel"><h2>Documento e contexto</h2>${pill(labels[n.etapa])}<div class="facts"><div><span>Unidade</span><strong>${n.unidade}</strong></div><div><span>Valor</span><strong>${money(n.valor)}</strong></div><div><span>Natureza</span><strong>${n.natureza}</strong></div><div><span>Vencimento</span><strong>${n.vencimento}</strong></div></div><div class="previewdoc"><span class="eyebrow">Representação do anexo</span><strong>Nota fiscal ${n.nf}</strong><span class="muted">PDF da nota + boleto de exemplo<br>Nenhum documento real nesta prévia</span></div>${n.narrativa?`<p><b>Narrativa</b><br>${esc(n.narrativa)}</p>`:''}${history(n)}</section><section class="panel">${action}</section></div>`);
if($('#contrato'))$('#contrato').value=n.contrato;if($('#expansao'))$('#expansao').value=n.expansao;if($('#pagamento'))$('#pagamento').value=n.pagamento;
const on=(id,fn)=>{if($('#'+id))$('#'+id).onclick=fn;};const move=(stage,text)=>{n.etapa=stage;log(n,text);render();openNote(n.id);notify(text+' · simulação');};
on('advance',()=>{if(can('equipe'))move('engenharia','Nota enviada à análise da engenharia');});
on('approve',()=>{if(!can('engenharia'))return;const narrative=$('#narrativa').value.trim(),contract=$('#contrato').value,expansion=$('#expansao').value;if(!narrative||!contract||!expansion)return notify('Preencha Narrativa, Contrato e Pertence à expansão para aprovar.');n.narrativa=narrative;n.contrato=contract;n.expansao=expansion;move(expansion==='Não'?'fora':contract==='Sim'?'contrato':'pedido','Análise aprovada; destino definido pelos três campos');});
on('return',()=>{if(!can('engenharia'))return;const reason=$('#motivo').value.trim();if(!reason)return notify('Informe o motivo da devolução.');move('rascunho','Devolvida para conferência: '+reason);});
on('linkcontract',()=>{if(!can('equipe'))return;const ref=$('#contractRef').value.trim();if(!ref)return notify('Informe a referência de contrato para simular o vínculo.');n.contratoRef=ref;move('pedido','Contrato vinculado: '+ref);});
on('register',()=>{if(!can('equipe'))return;const order=$('#pedido').value.trim();if(!order)return notify('Registre a referência do pedido lançado no Datasul.');n.pedido=order;move('aprovacao','Pedido registrado: '+order);});
on('approvedorder',()=>{if(can('equipe'))move('escrituracao','Equipe confirmou a aprovação do pedido');});
on('send',()=>{if(!can('equipe'))return;n.pagamento=$('#pagamento').value;n.emitente=$('#emitente').value.trim();n.boleto=$('#boleto').checked;n.dadosBanco=$('#dadosBanco').value.trim();if(!/^\d{1,9}$/.test(n.emitente))return notify('Informe um código de emitente Datasul com até nove dígitos. Não use o CNPJ.');if(n.pagamento==='Boleto'&&!n.boleto)return notify('Boleto ausente: o envio de exemplo foi bloqueado.');if(n.pagamento==='Dados Bancários'&&!n.dadosBanco)return notify('Preencha os dados bancários antes de simular o envio.');move(n.unidade.includes('Pinhal')||n.natureza==='Remessa'?'fiscal':'encaminhada','Encaminhamento concluído somente nesta demonstração');});}
function openReq(id){const r=requests.find(r=>r.id===id);let action='';if(r.etapa==='Aguardando Compras')action=`<h2>Iniciar negociação</h2>${permission('compras')}<label class="field">Comprador<input id="buyer" placeholder="Nome de exemplo"></label>${btn('assign','Atribuir e iniciar cotação',can('compras'))}`;
if(r.etapa==='Em cotação')action=`<h2>Negociação e propostas</h2><p class="muted">As propostas ficam anexadas ao processo. Esta prévia não carrega arquivos reais.</p><div class="previewdoc">Proposta A.pdf · Proposta B.pdf<br><small>Arquivos fictícios representados</small></div>${permission('compras')}<div class="actions">${btn('negotiated','Concluir negociação',can('compras'))}</div>`;
if(r.etapa==='Aguardando Engenharia')action=`<h2>Decisão da engenharia</h2><p class="muted">Prazo de aprovação encontrado na Monday: 3 dias. Aprovação de terceiros é uma decisão separada.</p>${permission('engenharia')}<label class="field">Aprovação de terceiros<select id="third"><option>Não solicitada</option><option>Pendente</option><option>Aprovado</option><option>Reprovado</option></select></label><label class="field">Justificativa / motivo de ajuste<input id="decisionReason" placeholder="Registre a decisão"></label><div class="actions">${btn('acceptreq','Aprovar requisição',can('engenharia'))}${btn('adjustreq','Solicitar ajuste',can('engenharia'),'')}</div><div class="note">A volta para ajuste é uma proposta de interação; o gatilho exato precisa ser validado com a equipe.</div>`;
if(r.etapa==='Aprovada')action='<h2>Requisição aprovada</h2><p>Decisão registrada na demonstração.</p><div class="note">As ações seguintes de entrega, situação da NF e finalização precisam ser validadas com a operação. A Monday move cotações para Aprovados ao alterar Data de Entrega, o que exige esclarecer o significado desse marco.</div>';
modal(r.nome,`<div class="split"><section class="panel"><h2>Requisição ↔ cotação</h2>${pill(r.etapa)}<div class="facts"><div><span>Identificação</span><strong>${r.id}</strong></div><div><span>Unidade</span><strong>${r.unidade}</strong></div><div><span>Tipo / prioridade</span><strong>${r.tipo} / ${r.prioridade}</strong></div><div><span>SLA</span><strong>${r.sla} dias corridos</strong></div><div><span>Comprador</span><strong>${esc(r.comprador)||'A definir'}</strong></div><div><span>Terceiros</span><strong>${r.terceiros}</strong></div></div><p class="muted">RM, descrição detalhada, certificado, frete e propostas permanecem ligados ao processo na implementação.</p>${history(r)}</section><section class="panel">${action}</section></div>`);
if($('#third'))$('#third').value=r.terceiros;const move=(stage,text)=>{r.etapa=stage;log(r,text);render();openReq(id);notify(text+' · simulação');};if($('#assign'))$('#assign').onclick=()=>{if(!can('compras'))return;const buyer=$('#buyer').value.trim();if(!buyer)return notify('Informe quem será responsável pela cotação.');r.comprador=buyer;move('Em cotação','Comprador atribuído; negociação iniciada');};if($('#negotiated'))$('#negotiated').onclick=()=>{if(can('compras'))move('Aguardando Engenharia','Negociação concluída; prazo de aprovação: 3 dias');};if($('#acceptreq'))$('#acceptreq').onclick=()=>{if(!can('engenharia'))return;const third=$('#third').value;if(['Pendente','Reprovado'].includes(third))return notify('Resolva a aprovação de terceiros antes de simular a conclusão. Esta dependência precisa de validação operacional.');r.terceiros=third;move('Aprovada','Engenharia aprovou a requisição');};if($('#adjustreq'))$('#adjustreq').onclick=()=>{if(!can('engenharia'))return;const reason=$('#decisionReason').value.trim();if(!reason)return notify('Informe o motivo do ajuste.');r.terceiros=$('#third').value;move('Em cotação','Ajuste solicitado: '+reason);};}
function newRequest(){if(!can('engenharia'))return;modal('Nova requisição',`<section class="panel"><label class="field">Nome da solicitação<input id="reqname" placeholder="Ex.: Materiais para a plataforma"></label><div class="fields"><label class="field">Tipo<select id="reqtype"><option>Material</option><option>Serviço</option><option>Equipamento</option></select></label><label class="field">Prioridade<select id="reqpriority"><option>Padrão</option><option>Urgente</option></select></label></div><p class="muted">Unidade de exemplo: 020 · Araraquara. O formulário real incluirá empresa, descrição, prazo desejado, aprovador e documentos.</p>${btn('createreq','Criar requisição e cotação')}</section>`);$('#createreq').onclick=()=>{const name=$('#reqname').value.trim();if(!name)return notify('Informe o nome da solicitação.');const type=$('#reqtype').value,priority=$('#reqpriority').value;requests.push({id:'REQ-EX-'+String(requests.length+1).padStart(3,'0'),nome:name,unidade:'020 · Araraquara',tipo:type,prioridade:priority,sla:priority==='Urgente'?3:type==='Serviço'?20:10,etapa:'Aguardando Compras',comprador:'',terceiros:'Não solicitada',history:['Requisição criada; cotação vinculada uma única vez.']});close();render();notify('Requisição e cotação criadas nesta demonstração.');};}
$$('.navbtn').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#perfil').onchange=e=>{perfil=e.target.value;close();if(view==='analise')tab=perfil==='engenharia'?'engenharia':'pedido';render();};$('#reset').onclick=()=>{init();close();render();notify('Demonstração reiniciada.');};document.addEventListener('keydown',e=>{if($('#modal').classList.contains('hidden'))return;if(e.key==='Escape')close();if(e.key==='Tab'){const focusable=$$('#modal button:not(:disabled), #modal input:not(:disabled), #modal select:not(:disabled), #modal textarea:not(:disabled), #modal a');const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
init();render();
</script>
</body></html>
